[project]
name = "mediaforge"
version = "0.1.0"
description = "Forge clean, organized media libraries for offline playback."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Sunny" }
]
dependencies = [
    "PyYAML>=6.0",
    "mutagen>=1.47",
]

[project.scripts]
mediaforge = "mediaforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4",
]